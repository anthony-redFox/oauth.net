<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1100" font-family="Arial, Helvetica, sans-serif">
  <title>Workload Authorization Grant flow</title>
  <defs>
    <marker id="dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="2000" height="1100" fill="#fff"/>

  <g fill="#eee" stroke="#555" stroke-width="2">
    <rect x="25" y="40" width="585" height="330" rx="50"/>
    <rect x="25" y="700" width="585" height="360" rx="50"/>
    <rect x="1365" y="40" width="585" height="330" rx="50"/>
    <rect x="1365" y="700" width="585" height="360" rx="50"/>
  </g>

  <g fill="#000" font-size="40" text-anchor="middle">
    <text x="318" y="190">Platform</text>
    <text x="318" y="260" font-size="30">(e.g. AI agent platform)</text>
    <text x="318" y="860">Agent</text>
    <text x="318" y="930" font-size="30">(a workload on the Platform)</text>
    <text x="1658" y="170">Authorization</text>
    <text x="1658" y="220">Server</text>
    <text x="1658" y="290" font-size="30">(e.g. authz server of SaaS app)</text>
    <text x="1658" y="860">Resource Server</text>
    <text x="1658" y="930" font-size="30">(e.g. SaaS app API)</text>
  </g>

  <g fill="#555" font-size="36">
    <!-- 0. one-time registration -->
    <line x1="640" y1="205" x2="1335" y2="205" stroke="#aaa" stroke-width="8" stroke-dasharray="30 22"/>
    <text x="660" y="160">0. Platform registration (once)</text>
    <text x="660" y="265" font-size="30">issuer + keys, configured by the AS admin</text>

    <!-- 1. Platform issues WAG to Agent -->
    <line x1="318" y1="395" x2="318" y2="675" stroke="#999" stroke-width="8" marker-end="url(#light)"/>
    <text x="350" y="520">1. WAG</text>
    <text x="350" y="565" font-size="30">signed JWT, sub = Agent</text>

    <!-- 2. Agent presents WAG to AS -->
    <line x1="640" y1="720" x2="1335" y2="400" stroke="#555" stroke-width="8" marker-end="url(#dark)"/>
    <text transform="translate(987,560) rotate(-24.7)" text-anchor="middle" y="-20">2. JWT Authorization Grant w/WAG</text>

    <!-- 3. Access token back to Agent -->
    <line x1="1335" y1="480" x2="640" y2="800" stroke="#999" stroke-width="8" marker-end="url(#light)"/>
    <text transform="translate(987,640) rotate(-24.7)" text-anchor="middle" y="64">3. Access Token (no refresh token)</text>

    <!-- 4. Agent calls RS -->
    <line x1="640" y1="1000" x2="1335" y2="1000" stroke="#555" stroke-width="8" marker-end="url(#dark)"/>
    <text x="660" y="975">4. API request w/Access Token</text>
  </g>
</svg>
